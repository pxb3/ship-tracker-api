#############################
# redis.conf for STP project
# AOF enabled, RDB snapshots disabled to reduce heavy snapshotting
#############################

# Disable RDB snapshotting (we rely on AOF for durability)
save ""

# Append only file (AOF) for durability; fsync every second
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Data directory
dir /data

# Optional: limit memory (set according to your host)
# maxmemory 1gb
# maxmemory-policy allkeys-lru

# Disable protected mode in containerized setups (use network controls)
protected-mode no

# Bind to all interfaces inside container
bind 0.0.0.0
