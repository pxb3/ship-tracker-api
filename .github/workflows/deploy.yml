# Requires these GitHub Environment variables (Settings > Environments > development/production),
# matching the "development"/"production" GitHub Environment names configured in terraform
# (module.github_oidc's github_environment var) for both environments:
#   AWS_ROLE_ARN               - environments/<env> output "github_actions_role_arn"
#   AWS_REGION                 - e.g. eu-west-1
#   ECS_CLUSTER                - environments/<env> output "ecs_cluster_name"
#   ECR_REPOSITORY_BACKEND     - ECR repo name for the backend image
#   ECR_REPOSITORY_INGESTION   - ECR repo name for the ingestion image
#   ECS_SERVICE_BACKEND        - environments/<env> output "ecs_service_backend"
#   ECS_SERVICE_INGESTION      - environments/<env> output "ecs_service_ingestion"
#   ECS_TASK_FAMILY_BACKEND    - "<project>-backend"
#   ECS_TASK_FAMILY_INGESTION  - "<project>-ingestion"
#
# Terraform only provisions the ECS cluster/services/initial task definitions;
# this workflow owns building images and rolling out new task definition revisions.
name: Deploy backend & ingestion to ECS

on:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY_BACKEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            -f Dockerfile.backend.development \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            --push .

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_FAMILY_BACKEND }} \
            --query taskDefinition > task-definition.json

      - name: Render new backend image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACKEND }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_BACKEND }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-ingestion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ingestion image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY_INGESTION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 \
            -f Dockerfile.ingestion.development \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            --push .

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_FAMILY_INGESTION }} \
            --query taskDefinition > task-definition.json

      - name: Render new ingestion image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ingestion
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_INGESTION }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_INGESTION }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
