# Ephemeral Postgres + Redis used only by `npm run test:integration`.
# Ports are offset from the dev services to avoid clashing with them.
services:
  postgres-test:
    image: postgres:17
    container_name: stp-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: shiptracker_test
      # trust: Docker Desktop/WSL2's port-proxy mangles password auth packets
      # (both SCRAM and md5) over forwarded ports, so password auth reliably
      # fails from the Windows host even with correct credentials. This is an
      # ephemeral, host-only test database, so trust is an acceptable tradeoff.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d shiptracker_test']
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7
    container_name: stp-redis-test
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
